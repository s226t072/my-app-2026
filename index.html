<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わんこ育成アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>わんこ育成アプリ</h1>
        
        <div class="dog-display">
            <div id="dog" class="dog-emoji">🐶</div>
            <div id="message" class="message-bubble">クーン...</div>
        </div>

        <div class="status-container">
            <div class="status-item">
                <label>おなか:</label>
                <div class="progress-bar"><div id="hunger-bar" class="progress-fill"></div></div>
            </div>
            <div class="status-item">
                <label>ごきげん:</label>
                <div class="progress-bar"><div id="happiness-bar" class="progress-fill"></div></div>
            </div>
            <div class="status-item">
                <label>たいりょく:</label>
                <div class="progress-bar"><div id="energy-bar" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="actions">
            <button id="feed-btn">ごはんをあげる</button>
            <button id="play-btn">あそぶ</button>
            <button id="sleep-btn">ねかせる</button>
            <button id="reset-btn" class="secondary">リセット</button>
        </div>

        <div class="log-container">
            <h3>かつどうログ</h3>
            <ul id="log-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
