<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふわふわわんこ育成</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Naming Overlay -->
        <div id="naming-overlay" class="overlay hidden">
            <div class="modal">
                <h2>わんこをむかえよう！</h2>
                <p>なんて おなまえに する？</p>
                <input type="text" id="dog-name-input" placeholder="ここになまえをいれてね" maxlength="10">
                <button id="start-game-btn" class="btn-main">いっしょにあそぶ！</button>
            </div>
        </div>

        <header>
            <div class="dog-info-header">
                <span id="display-dog-name" class="name-tag">わんこ</span>
                <button id="rename-btn" class="btn-icon">✏️</button>
            </div>
            <div class="coin-display">
                <span class="coin-icon">💰</span> <span id="coin-count">0</span>
            </div>
        </header>
        
        <div class="main-view">
            <div class="dog-display">
                <div class="dog-wrapper">
                    <div id="accessory-slot" class="accessory"></div>
                    <div id="dog" class="dog-emoji">🐶</div>
                </div>
                <div id="message" class="message-bubble">クーン...</div>
            </div>

            <div class="status-container">
                <div class="status-item">
                    <span class="status-icon">🍖</span>
                    <div class="progress-bar"><div id="hunger-bar" class="progress-fill"></div></div>
                </div>
                <div class="status-item">
                    <span class="status-icon">💖</span>
                    <div class="progress-bar"><div id="happiness-bar" class="progress-fill"></div></div>
                </div>
                <div class="status-item">
                    <span class="status-icon">⚡</span>
                    <div class="progress-bar"><div id="energy-bar" class="progress-fill"></div></div>
                </div>
            </div>

            <div class="actions">
                <button id="feed-btn" class="btn-main">ごはん</button>
                <button id="play-btn" class="btn-main">あそぶ</button>
                <button id="sleep-btn" class="btn-main">ねる</button>
                <button id="shop-tab-btn" class="btn-sub">ショップ & アイテム</button>
            </div>
        </div>

        <!-- Shop & Items View -->
        <div id="shop-view" class="sub-view hidden">
            <div class="view-header">
                <h3>おみせ & もちもの</h3>
                <button id="close-shop-btn" class="btn-close">×</button>
            </div>
            <div class="shop-content">
                <div class="shop-section">
                    <h4>ショップ</h4>
                    <div class="shop-items">
                        <div class="shop-item">
                            <div class="item-info"><span>🍖</span> 高級な肉 (50枚)</div>
                            <button class="buy-btn" data-item="premium_food" data-price="50">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>🍰</span> おやつ (30枚)</div>
                            <button class="buy-btn" data-item="treat" data-price="30">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>🥛</span> ミルク (20枚)</div>
                            <button class="buy-btn" data-item="milk" data-price="20">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>🎀</span> リボン (100枚)</div>
                            <button class="buy-btn" data-item="ribbon" data-price="100">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>🎩</span> ぼうし (150枚)</div>
                            <button class="buy-btn" data-item="hat" data-price="150">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>👑</span> かんむり (500枚)</div>
                            <button class="buy-btn" data-item="crown" data-price="500">かう</button>
                        </div>
                        <div class="shop-item">
                            <div class="item-info"><span>👓</span> めがね (200枚)</div>
                            <button class="buy-btn" data-item="glasses" data-price="200">かう</button>
                        </div>
                    </div>
                </div>
                <div class="inventory-section">
                    <h4>もちもの</h4>
                    <div id="inventory-list" class="inventory-list"></div>
                </div>
            </div>
        </div>

        <div class="log-container">
            <h3>おもいでログ</h3>
            <ul id="log-list"></ul>
            <button id="reset-btn" class="btn-reset">最初からやりなおす</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
